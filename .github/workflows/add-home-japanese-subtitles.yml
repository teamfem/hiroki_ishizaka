name: Add homepage Japanese subtitles

on:
  push:
    paths:
      - '.github/workflows/add-home-japanese-subtitles.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Japanese subtitles
        run: python .github/scripts/add-home-japanese-subtitles.py
      - name: Commit homepage
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add Japanese subtitles to homepage research themes'
          git push
