name: Fix arXiv 2608.15262

on:
  push:
    paths:
      - '.github/workflows/fix-arxiv-2608-15262.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct publications entry
        run: python .github/scripts/fix-arxiv-2608-15262.py
      - name: Commit correction
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add publications/index.html
          git commit -m 'Link arXiv 2608.15262 from N3 research note'
          git push
