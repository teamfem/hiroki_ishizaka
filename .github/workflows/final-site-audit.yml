name: Final site audit

on:
  push:
    paths:
      - '.github/workflows/final-site-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run final site audit
        run: python .github/scripts/final-site-audit.py
# rerun after verification-file exclusion
