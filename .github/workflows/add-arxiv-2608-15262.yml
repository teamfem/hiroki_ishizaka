name: Add arXiv 2608.15262

on:
  push:
    paths:
      - '.github/workflows/add-arxiv-2608-15262.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update publications page
        run: python .github/scripts/add-arxiv-2608-15262.py
      - name: Commit update
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add publications/index.html
          git commit -m 'Add new arXiv preprint to publications'
          git push
