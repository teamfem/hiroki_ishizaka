name: Stable reduction SEO cluster

on:
  push:
    paths:
      - '.github/workflows/build-memory-seo-cluster.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Blog cluster
        run: python .github/scripts/build-memory-seo-cluster.py
      - name: Commit updates
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blog/index.html blog/posts/unresolved-memory-01.html blog/posts/unresolved-memory-02.html blog/posts/unresolved-memory-03.html blog/posts/unresolved-memory-05.html blog/posts/unresolved-memory-09.html blog/posts/unresolved-memory-10.html
          git commit -m 'Build stable reduction and memory search-entry cluster'
          git push
