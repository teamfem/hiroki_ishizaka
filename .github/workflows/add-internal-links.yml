name: Add internal research links

on:
  push:
    paths:
      - '.github/workflows/add-internal-links.yml'

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add contextual internal links
        run: python .github/scripts/add-internal-links.py
      - name: Commit internal-link improvements
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/index.html publications/index.html fem/index.html blog/index.html
          git commit -m 'Add thematic internal links across research pages'
          git push
