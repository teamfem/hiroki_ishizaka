name: Full-site SEO audit

on:
  push:
    paths:
      - '.github/workflows/seo-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit sitemap pages and internal links
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urljoin, urlparse, urldefrag
          import xml.etree.ElementTree as ET
          import re
          from collections import defaultdict

          BASE = 'https://teamfem.github.io/hiroki_ishizaka/'
          PROJECT = '/hiroki_ishizaka/'
          HOST = 'teamfem.github.io'

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.title = ''
                  self._in_title = False
                  self.h1 = []
                  self._in_h1 = False
                  self._h1_buf = []
                  self.description = None
                  self.canonical = None
                  self.robots = None
                  self.hrefs = []
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == 'title': self._in_title = True
                  if tag == 'h1':
                      self._in_h1 = True
                      self._h1_buf = []
                  if tag == 'meta':
                      name = (a.get('name') or '').lower()
                      if name == 'description': self.description = a.get('content','').strip()
                      if name == 'robots': self.robots = a.get('content','').strip()
                  if tag == 'link' and (a.get('rel') or '').lower() == 'canonical':
                      self.canonical = (a.get('href') or '').strip()
                  if tag == 'a' and a.get('href'):
                      self.hrefs.append(a['href'].strip())
              def handle_endtag(self, tag):
                  if tag == 'title': self._in_title = False
                  if tag == 'h1' and self._in_h1:
                      text = ' '.join(''.join(self._h1_buf).split())
                      self.h1.append(text)
                      self._in_h1 = False
              def handle_data(self, data):
                  if self._in_title: self.title += data
                  if self._in_h1: self._h1_buf.append(data)

          def local_for_url(url):
              p = urlparse(url).path
              if not p.startswith(PROJECT): return None
              rel = p[len(PROJECT):]
              if not rel: return Path('index.html')
              if rel.endswith('/'): return Path(rel) / 'index.html'
              return Path(rel)

          def target_exists(abs_url):
              p = urlparse(abs_url).path
              if not p.startswith(PROJECT): return True
              rel = p[len(PROJECT):]
              path = Path(rel)
              candidates = []
              if not rel:
                  candidates = [Path('index.html')]
              elif rel.endswith('/'):
                  candidates = [path / 'index.html']
              elif path.suffix:
                  candidates = [path]
              else:
                  candidates = [path, path / 'index.html', Path(str(path)+'.html')]
              return any(c.exists() for c in candidates)

          root = ET.parse('sitemap.xml').getroot()
          ns = {'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls = [e.text.strip() for e in root.findall('s:url/s:loc', ns) if e.text]

          issues = []
          warnings = []
          records = []
          title_map = defaultdict(list)
          desc_map = defaultdict(list)
          broken = []

          for url in urls:
              path = local_for_url(url)
              if path is None or not path.exists():
                  issues.append(f'MISSING FILE | {url} | expected {path}')
                  continue
              text = path.read_text(encoding='utf-8', errors='replace')
              p = Parser(); p.feed(text)
              title = ' '.join(p.title.split())
              desc = p.description or ''
              canonical = p.canonical or ''
              records.append((url, str(path), title, desc, canonical, p.h1, p.robots or ''))
              if not title: issues.append(f'MISSING TITLE | {url}')
              if not desc: issues.append(f'MISSING DESCRIPTION | {url}')
              if not canonical: issues.append(f'MISSING CANONICAL | {url}')
              elif canonical.rstrip('/') != url.rstrip('/'):
                  issues.append(f'CANONICAL MISMATCH | {url} | {canonical}')
              if len(p.h1) != 1:
                  issues.append(f'H1 COUNT {len(p.h1)} | {url} | {p.h1}')
              if 'noindex' in (p.robots or '').lower():
                  issues.append(f'NOINDEX IN SITEMAP | {url}')
              if title:
                  title_map[title].append(url)
                  if len(title) < 20 or len(title) > 70:
                      warnings.append(f'TITLE LENGTH {len(title)} | {url} | {title}')
              if desc:
                  desc_map[desc].append(url)
                  if len(desc) < 60 or len(desc) > 180:
                      warnings.append(f'DESCRIPTION LENGTH {len(desc)} | {url} | {desc}')
              for href in p.hrefs:
                  if not href or href.startswith(('#','mailto:','tel:','javascript:','data:')):
                      continue
                  abs_url = urljoin(url, href)
                  parsed = urlparse(abs_url)
                  if parsed.netloc and parsed.netloc != HOST:
                      continue
                  abs_url = urldefrag(abs_url)[0]
                  if parsed.path.startswith(PROJECT) and not target_exists(abs_url):
                      broken.append((url, href, abs_url))

          for title, us in title_map.items():
              if len(us) > 1:
                  issues.append('DUPLICATE TITLE | ' + title + ' | ' + ' ; '.join(us))
          for desc, us in desc_map.items():
              if len(us) > 1:
                  warnings.append('DUPLICATE DESCRIPTION | ' + ' ; '.join(us))
          for src, href, target in broken:
              issues.append(f'BROKEN INTERNAL LINK | {src} | {href} -> {target}')

          out = []
          out.append('FULL-SITE SEO AUDIT')
          out.append('===================')
          out.append(f'Sitemap URLs: {len(urls)}')
          out.append(f'Parsed pages: {len(records)}')
          out.append(f'Critical issues: {len(issues)}')
          out.append(f'Warnings: {len(warnings)}')
          out.append('')
          out.append('CRITICAL ISSUES')
          out.append('---------------')
          out.extend(issues or ['None'])
          out.append('')
          out.append('WARNINGS')
          out.append('--------')
          out.extend(warnings or ['None'])
          out.append('')
          out.append('PAGE INVENTORY')
          out.append('--------------')
          for url, path, title, desc, canonical, h1s, robots in records:
              out.append(f'URL: {url}')
              out.append(f'FILE: {path}')
              out.append(f'TITLE: {title}')
              out.append(f'DESCRIPTION: {desc}')
              out.append(f'CANONICAL: {canonical}')
              out.append(f'H1: {h1s}')
              out.append(f'ROBOTS: {robots}')
              out.append('')

          Path('seo-audit.txt').write_text('\n'.join(out), encoding='utf-8')
          PY
      - name: Commit audit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add seo-audit.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add full-site SEO audit report'
          git push
