name: Update sitemap lastmod

on:
  push:
    paths:
      - '**/*.html'
      - '.github/workflows/update-sitemap-lastmod.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate sitemap lastmod values
        run: python .github/scripts/update-sitemap-lastmod.py
      - name: Commit sitemap if changed
        run: |
          if git diff --quiet -- sitemap.xml; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sitemap.xml
          git commit -m 'Update sitemap lastmod values'
          git push
