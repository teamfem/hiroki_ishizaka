name: Trim Blog legacy assets

on:
  push:
    paths:
      - '.github/workflows/trim-blog-legacy.yml'

permissions:
  contents: write

jobs:
  trim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove unnecessary jQuery from modern Blog posts
        run: python .github/scripts/trim-blog-legacy.py
      - name: Commit Blog asset cleanup
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/utility.js blog/posts/*.html
          git commit -m 'Remove legacy jQuery from modern Blog posts'
          git push
