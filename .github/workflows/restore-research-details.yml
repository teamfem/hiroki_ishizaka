name: Restore detailed Research content

on:
  push:
    paths:
      - '.github/workflows/restore-research-details.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore detailed Research map
        run: python .github/scripts/restore-research-details.py
      - name: Commit restored Research content
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/index.html
          git commit -m 'Restore detailed Research map and archive access'
          git push
