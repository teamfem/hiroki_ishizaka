name: Diagnose blog TeX delimiters

on:
  push:
    paths:
      - '.github/workflows/diagnose-blog-delims.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose delimiters
        run: node scripts/diagnose_blog_delims.js
