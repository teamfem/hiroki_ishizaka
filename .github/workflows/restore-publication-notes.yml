name: Restore publication notes

on:
  push:
    paths:
      - '.github/workflows/restore-publication-notes.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore research notes section
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('publications/index.html')
          text=p.read_text(encoding='utf-8')
          if 'id="notes"' in text:
              print('Notes already present')
              raise SystemExit(0)
          old='<a href="#preparation">In preparation</a><a href="#pipeline">Research pipeline</a>'
          new='<a href="#preparation">In preparation</a><a href="#notes">Research notes</a><a href="#pipeline">Research pipeline</a>'
          if old not in text:
              raise SystemExit('Publication tab insertion point not found')
          text=text.replace(old,new,1)
          marker='<section id="pipeline" class="section">'
          if marker not in text:
              raise SystemExit('Pipeline insertion point not found')
          notes='''<section id="notes" class="section"><div class="shell"><div class="section-head"><div><div class="kicker">Research notes</div><h2>Public and working notes.</h2></div><p>Research notes are listed separately from peer-reviewed papers, submitted manuscripts and manuscripts in preparation.</p></div><div class="pub-list">
<article class="pub"><div class="pub-top"><div><span class="pub-id">[N3]</span><h3>Stable Reduction of Unresolved Dynamics: An Operator-Theoretic Framework</h3><div class="pub-meta"><b>H. Ishizaka</b></div></div><span class="status">Research note</span></div></article>
<article class="pub"><div class="pub-top"><div><span class="pub-id">[N2]</span><h3>Interpolation error analysis using a new geometric parameter</h3><div class="pub-meta"><b>H. Ishizaka</b></div></div><span class="status">Public note</span></div><div class="pub-links"><a href="https://arxiv.org/abs/2504.16012">arXiv</a></div></article>
<article class="pub"><div class="pub-top"><div><span class="pub-id">[N1]</span><h3>Note on a weakly over-penalised symmetric interior penalty method on anisotropic meshes for the Poisson equation, Ver. 1</h3><div class="pub-meta"><b>H. Ishizaka</b> · A revised version is planned; the current version contains points to be corrected.</div></div><span class="status">Public note</span></div><div class="pub-links"><a href="https://arxiv.org/abs/2403.07899">arXiv</a></div></article>
</div></div></section>
'''
          text=text.replace(marker,notes+marker,1)
          p.write_text(text,encoding='utf-8')
          PY
      - name: Commit restored notes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add publications/index.html
          git commit -m 'Restore research notes on Publications page'
          git push
