name: Fix detected blog TeX errors

on:
  push:
    paths:
      - '.github/workflows/fix-blog-tex.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified TeX fixes
        shell: python
        run: |
          from pathlib import Path

          fixes = []

          p = Path('blog/posts/anisotropic-geometry-07.html')
          s = p.read_text(encoding='utf-8')
          old = r'\left\{\mathcal T_{N,\delta}\night\}_{N,\delta}'
          new = r'\left\{\mathcal T_{N,\delta}\right\}_{N,\delta}'
          assert old in s
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          fixes.append(str(p))

          p = Path('blog/posts/article10may26_3.html')
          s = p.read_text(encoding='utf-8')
          assert s.count('\x07lpha') == 2
          p.write_text(s.replace('\x07lpha', r'\alpha'), encoding='utf-8')
          fixes.append(str(p))

          p = Path('blog/posts/chatgpt-fem-15.html')
          s = p.read_text(encoding='utf-8')
          old = r'\text{\(P_0\)-projection error}'
          new = r'P_0\text{-projection error}'
          assert old in s
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          fixes.append(str(p))

          p = Path('blog/posts/chatgpt-fem-16.html')
          s = p.read_text(encoding='utf-8')
          old = r'\text{\(P_0\) projection error}'
          new = r'P_0\text{ projection error}'
          assert old in s
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          fixes.append(str(p))

          p = Path('blog/posts/unresolved-memory-06.html')
          s = p.read_text(encoding='utf-8')
          old = '\\bigr\\}\n\\tag{21}\n\\end{aligned}'
          new = '\\bigr\\}\n\\end{aligned}\n\\tag{21}'
          assert old in s
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          fixes.append(str(p))

          print('Fixed:')
          print('\n'.join(fixes))

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install MathJax parser
        run: npm install --no-save mathjax-full@3
      - name: Verify all blog TeX
        run: node scripts/audit_blog_tex.js
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/posts/anisotropic-geometry-07.html \
                  blog/posts/article10may26_3.html \
                  blog/posts/chatgpt-fem-15.html \
                  blog/posts/chatgpt-fem-16.html \
                  blog/posts/unresolved-memory-06.html
          git commit -m "Fix MathJax errors across blog posts"
          git push
