name: Restore homepage profile content

on:
  push:
    paths:
      - '.github/workflows/restore-home-profile.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore homepage profile and philosophy
        run: python .github/scripts/restore-home-profile.py
      - name: Commit homepage restoration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Restore professional profile and extended research philosophy'
          git push
