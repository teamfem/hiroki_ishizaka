name: Static eight-tab navigation

on:
  push:
    paths:
      - '.github/workflows/static-eight-tab-nav.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalise static navigation
        run: python .github/scripts/static-eight-tab-nav.py
      - name: Commit updates
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' '**/*.html' js/utility.js js/modern-ui.js
          git commit -m 'Make eight-tab navigation static across the site'
          git push
