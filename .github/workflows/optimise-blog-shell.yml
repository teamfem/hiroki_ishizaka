name: Optimise Blog shell

on:
  push:
    paths:
      - '.github/workflows/optimise-blog-shell.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Optimise Blog shell
        run: python .github/scripts/optimise-blog-shell.py
      - name: Commit updates
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blog/posts js/utility.js
          git commit -m 'Optimise Blog stylesheet loading and article dates'
          git push
# rerun after supporting alternate legacy head markup
