name: Exact-curved FEM SEO cluster

on:
  push:
    paths:
      - '.github/workflows/build-exact-curved-seo-cluster.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Exact-curved FEM cluster
        run: python .github/scripts/build-exact-curved-seo-cluster.py
      - name: Commit updates
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blog/index.html blog/posts/exact-curved-fem-01.html blog/posts/exact-curved-fem-02.html blog/posts/exact-curved-fem-03.html blog/posts/exact-curved-fem-04.html blog/posts/exact-curved-fem-05.html blog/posts/exact-curved-fem-06.html
          git commit -m 'Build Exact-curved FEM search-entry cluster'
          git push
