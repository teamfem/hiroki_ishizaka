name: Link Publications and Visions to Blog clusters

on:
  push:
    paths:
      - '.github/workflows/link-publications-visions-clusters.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update reverse research-cluster links
        run: python .github/scripts/link-publications-visions-clusters.py
      - name: Commit updates
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add publications/index.html fem/index.html
          git commit -m 'Connect Publications and Visions to Blog clusters'
          git push
