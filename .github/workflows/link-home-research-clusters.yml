name: Link Home and Research to Blog clusters

on:
  push:
    paths:
      - '.github/workflows/link-home-research-clusters.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update cluster links
        run: python .github/scripts/link-home-research-clusters.py
      - name: Commit updates
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html research/index.html
          git commit -m 'Connect Home and Research to the three Blog clusters'
          git push
