name: Final SEO metadata cleanup

on:
  push:
    paths:
      - '.github/workflows/finish-seo.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean duplicate metadata
        run: python .github/scripts/finish-seo.py
      - name: Run strengthened site audit
        run: python .github/scripts/final-site-audit.py
      - name: Commit updates
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blog/posts '*.html' '**/*.html' .github/scripts/final-site-audit.py
          git commit -m 'Remove duplicate SEO descriptions and strengthen audit'
          git push
