name: Build static detail pages

on:
  push:
    paths:
      - '.github/workflows/build-static-detail-pages.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate crawlable detail pages
        run: python .github/scripts/build-static-detail-pages.py
      - name: Commit generated pages
        run: |
          if git diff --quiet && [ -f fem/details.html ] && [ -f suppl/details.html ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fem/details.html suppl/details.html fem/index.html suppl/index.html sitemap.xml
          git commit -m 'Add crawlable detailed Research Visions and learning maps'
          git push
