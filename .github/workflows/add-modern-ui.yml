name: Modern site cleanup

on:
  push:
    paths:
      - '.github/workflows/add-modern-ui.yml'

permissions:
  contents: write

jobs:
  cleanup-modern-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finalise shared UI and remove preview duplicates
        run: |
          python - <<'PY'
          from pathlib import Path

          targets = [
              Path('index.html'),
              Path('research/index.html'),
              Path('publications/index.html'),
              Path('fem/index.html'),
              Path('suppl/index.html'),
              Path('blog/index.html'),
              Path('geo/index.html'),
              Path('links/index.html'),
          ]

          for path in targets:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              if 'modern.css' in text and 'modern-ui.js' not in text:
                  src = './js/modern-ui.js' if path.parent == Path('.') else '../js/modern-ui.js'
                  if '</body>' in text:
                      text = text.replace('</body>', f'<script src="{src}"></script>\n</body>', 1)
                      path.write_text(text, encoding='utf-8')

          geo_html = Path('geo/legacy-details.html')
          geo_txt = Path('geo/legacy-details.txt')
          if geo_html.exists() and not geo_txt.exists():
              geo_html.rename(geo_txt)
          geo_index = Path('geo/index.html')
          if geo_index.exists():
              text = geo_index.read_text(encoding='utf-8')
              text = text.replace("./legacy-details.html", "./legacy-details.txt")
              geo_index.write_text(text, encoding='utf-8')

          previews = [
              Path('modern-home-preview.html'),
              Path('research/modern-preview.html'),
              Path('publications/modern-preview.html'),
              Path('fem/modern-preview.html'),
              Path('suppl/modern-preview.html'),
              Path('blog/modern-preview.html'),
              Path('geo/modern-preview.html'),
              Path('links/modern-preview.html'),
              Path('blog/posts/anisotropic-geometry-01-modern-preview.html'),
              Path('geo/legacy-note.txt'),
          ]
          for path in previews:
              if path.exists():
                  path.unlink()
          PY
      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalise modern site UI and remove preview files'
          git push
