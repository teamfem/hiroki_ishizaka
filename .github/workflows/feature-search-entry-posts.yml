name: Feature search entry posts

on:
  push:
    paths:
      - '.github/workflows/feature-search-entry-posts.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Blog search entry points
        run: python .github/scripts/feature-search-entry-posts.py
      - name: Commit search-entry optimisation
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blog/index.html blog/posts/anisotropic-geometry-01.html blog/posts/anisotropic-geometry-02.html blog/posts/anisotropic-geometry-05.html blog/posts/anisotropic-geometry-07.html blog/posts/paradoxes-pitfalls-01.html blog/posts/paradoxes-pitfalls-02.html
          git commit -m 'Feature six search entry notes and improve descriptions'
          git push
